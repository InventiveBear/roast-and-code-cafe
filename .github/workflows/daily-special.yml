name: Rotate Daily Coffee Special

on:
  # Runs every day at 07:00 UTC (12:00 PM PKT)
  schedule:
    - cron: '0 7 * * *'
  # Allows manual testing anytime from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-special:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate today's special
        run: |
          DAY=$(date +%A)
          case "$DAY" in
            Monday)
              DRINK="Maple Bourbon Latte"
              DESC="Double espresso, steamed oat milk, and pure Vermont maple syrup."
              PRICE="\$5.25"
              ;;
            Tuesday)
              DRINK="Cardamom Rose Cold Brew"
              DESC="18-hour steeped cold brew infused with crushed green cardamom and rosewater."
              PRICE="\$5.00"
              ;;
            Wednesday)
              DRINK="Honey Cinnamon Cortado"
              DESC="Double shot espresso with local wildflower honey and Ceylon cinnamon."
              PRICE="\$4.50"
              ;;
            Thursday)
              DRINK="Salted Caramel Flat White"
              DESC="Velvety micro-foam over ristretto shots with house-made sea salt caramel."
              PRICE="\$4.95"
              ;;
            Friday)
              DRINK="Espresso Tonic"
              DESC="Chilled single-origin espresso floated over botanical tonic water and orange peel."
              PRICE="\$4.75"
              ;;
            Saturday)
              DRINK="Kenyan AA Pour-Over"
              DESC="Hand-brewed V60 with bright notes of blackcurrant, grapefruit, and cane sugar."
              PRICE="\$5.50"
              ;;
            Sunday)
              DRINK="Mocha Hazelnut Cappuccino"
              DESC="Dark 70% cocoa ganache melted into espresso with roasted hazelnut foam."
              PRICE="\$5.15"
              ;;
          esac

          cat <<EOF > special.json
          {
            "day": "$DAY",
            "drink": "$DRINK",
            "description": "$DESC",
            "price": "$PRICE"
          }
          EOF

      - name: Commit and push updated special
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add special.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update daily special for $(date +%A)" && git push)