name: Deploy & Monitor Coffee Shop

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'special.json'
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static files
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  health-check:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CDN propagation
        if: github.event_name != 'schedule'
        run: sleep 10

      - name: Verify live site status and content
        run: |
          SITE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "Checking $SITE_URL"
          
          STATUS=$(curl -s -o page.html -w "%{http_code}" "$SITE_URL")
          echo "HTTP Status: $STATUS"
          
          if [ "$STATUS" -ne 200 ]; then
            echo "Alert: Coffee shop site returned $STATUS!"
            exit 1
          fi
          
          if ! grep -q "Roast & Code" page.html; then
            echo "Alert: Site loaded, but expected content is missing!"
            exit 1
          fi
          
          echo "Success: Coffee shop is live and serving valid content."